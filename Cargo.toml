[package]
name = "natural"
version = "0.1.0"
edition = "2024"


[dependencies]
bootloader = "0.9"
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = "0.15.5"
uart_16550 = "0.6.0"
pic8259 = "0.11.0"
[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]


[[bin]]
name = "natural"
test = true
bench = false

[package.metadata.bootimage]
run-args = ["-display", "cocoa,zoom-to-fit=on"]
test-args = [
  "-device",
  "isa-debug-exit,iobase=0xf4,iosize=0x04",
  "-serial",
  "stdio",
  "-display",
  "none",
]
test-timeout = 300 # (em segundos)
test-success-exit-code = 33


[[test]]
name = "kernel"
path = "tests/kernel/main.rs"

[[test]]
name = "kernel_panic"
path = "tests/kernel/panic.rs"
harness = false

[[test]]
name = "stack_overflow"
path = "tests/kernel/stack_overflow.rs"
harness = false

[profile.dev]

[profile.release]
