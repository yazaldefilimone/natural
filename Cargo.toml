[package]
name = "natural"
version = "0.1.0"
edition = "2024"


[dependencies]
bootloader = "0.9"
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = "0.15.5"
uart_16550 = "0.6.0"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]


[[bin]]
name = "natural"
test = false
bench = false

[package.metadata.bootimage]
run-args = ["-display", "cocoa,zoom-to-fit=on"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
